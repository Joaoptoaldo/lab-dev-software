spring.application.name=ProjetoSpringApi

spring.datasource.url=jdbc:mysql://localhost:3306/bancoclientes?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=laboratorio
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# parâmetros de log
logging.level.org.hibernate.SQL=DEBUG
